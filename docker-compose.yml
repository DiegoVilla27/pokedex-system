name: pokedex-system

networks:
  shared-network:
    external: true

services:
  pokedex-api:
    build:
      context: ./apps/pokedex-api
      dockerfile: Dockerfile
    container_name: pokedex_api
    restart: always
    env_file:
      - ./apps/pokedex-api/.env
    environment:
      - POSTGRES_URL=jdbc:postgresql://global_postgres:5432/pokemon_db
    ports:
      - "8080:8080"
    networks:
      - shared-network

  pokedex-backoffice:
    build:
      context: .
      dockerfile: apps/pokedex-backoffice/Dockerfile
    container_name: pokedex_backoffice
    restart: always
    ports:
      - "4200:4200"
    networks:
      - shared-network
