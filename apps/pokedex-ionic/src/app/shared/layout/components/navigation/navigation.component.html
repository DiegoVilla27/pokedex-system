<ion-tab-bar slot="bottom">
  <ion-tab-button
    tab="pokedex"
    [routerLink]="['/pokedex']"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    <ion-icon name="home"></ion-icon>
    Pokédex
  </ion-tab-button>
  <ion-tab-button
    tab="favorites"
    [routerLink]="['/favorites']"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    <ion-icon name="heart"></ion-icon>
    Favorites
  </ion-tab-button>
</ion-tab-bar>
